  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

rection:column;gap:44px\">\n\n    <header style=\"display:flex;flex-direction:column;gap:16px;max-width:760px\">\n      <div style=\"font-family:'Martian Mono',monospace;font-size:12px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:#5A6B85\">Email signature · Team template<\u002Fdiv>\n      <h1 style=\"margin:0;font-size:48px;font-weight:500;line-height:1.05;letter-spacing:0\">Fill in four fields, pick a version, <em style=\"font-style:italic;color:#2A78EA\">copy<\u002Fem>.<\u002Fh1>\n    <\u002Fheader>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:48px;align-items:start\">\n\n      <div style=\"display:flex;flex-direction:column;gap:16px;background:#FFFFFF;border:1px solid rgba(11,33,61,0.12);border-radius:12px;padding:32px;box-shadow:0 1px 3px rgba(11,33,61,0.06);min-width:0\">\n        <div style=\"font-family:'Martian Mono',monospace;font-size:11px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:#5A6B85\">Your details<\u002Fdiv>\n        <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#5A6B85\">Name\n          <input type=\"text\" value=\"{{ name }}\" sc-camel-on-change=\"{{ onName }}\" placeholder=\"Name Last Name\" style=\"width:100%;box-sizing:border-box;font-size:15px;color:#0B213D;background:#FFFFFF;border:1px solid #E1E5EC;border-radius:8px;padding:11px 13px;outline:none\" style-focus=\"border-color:#2A78EA\">\n        <\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#5A6B85\">Title\n          <input type=\"text\" value=\"{{ title }}\" sc-camel-on-change=\"{{ onTitle }}\" placeholder=\"Head of Brand Design\" style=\"width:100%;box-sizing:border-box;font-size:15px;color:#0B213D;background:#FFFFFF;border:1px solid #E1E5EC;border-radius:8px;padding:11px 13px;outline:none\" style-focus=\"border-color:#2A78EA\">\n        <\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#5A6B85\">Phone\n          <input type=\"text\" value=\"{{ phone }}\" sc-camel-on-change=\"{{ onPhone }}\" placeholder=\"+52 000 000 0000\" style=\"width:100%;box-sizing:border-box;font-size:15px;color:#0B213D;background:#FFFFFF;border:1px solid #E1E5EC;border-radius:8px;padding:11px 13px;outline:none\" style-focus=\"border-color:#2A78EA\">\n        <\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#5A6B85\">LinkedIn profile URL\n          <input type=\"text\" value=\"{{ linkedin }}\" sc-camel-on-change=\"{{ onLinkedin }}\" placeholder=\"https://www.linkedin.com/in/…\" style=\"width:100%;box-sizing:border-box;font-size:15px;color:#0B213D;background:#FFFFFF;border:1px solid #E1E5EC;border-radius:8px;padding:11px 13px;outline:none\" style-focus=\"border-color:#2A78EA\">\n        <\u002Flabel>\n      <\u002Fdiv>\n\n      <div style=\"display:flex;flex-direction:column;gap:20px;min-width:0\">\n        <div style=\"display:flex;gap:8px;flex-wrap:wrap\">\n          <button type=\"button\" sc-camel-on-click=\"{{ pickAnimated }}\" style=\"{{ tabAnimStyle }}\" style-hover=\"border-color:#2A78EA\">Animated<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ pickStatic }}\" style=\"{{ tabStaticStyle }}\" style-hover=\"border-color:#2A78EA\">Static<\u002Fbutton>\n          <button type=\"button\" sc-camel-on-click=\"{{ pickText }}\" style=\"{{ tabTextStyle }}\" style-hover=\"border-color:#2A78EA\">Cold outreach<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"background:#FFFFFF;border:1px solid rgba(11,33,61,0.12);border-radius:12px;box-shadow:0 1px 3px rgba(11,33,61,0.06);padding:36px 40px 40px;overflow:auto\">\n          <div style=\"font-size:15px;line-height:1.4;color:rgba(11,33,61,0.35);margin-bottom:6px\">Best,<\u002Fdiv>\n          <div style=\"font-family:'Martian Mono',monospace;font-size:13px;color:rgba(11,33,61,0.2);margin-bottom:26px\">--<\u002Fdiv>\n\n          <sc-if value=\"{{ isText }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"white-space:nowrap\">\n              <div style=\"font-size:15px;font-weight:700;line-height:21px;color:#0B213D\">{{ name }}<\u002Fdiv>\n              <div style=\"font-size:15px;line-height:21px;color:#0B213D\">{{ titleWithCompany }}<\u002Fdiv>\n              <div style=\"font-size:15px;line-height:21px;color:#0B213D\">{{ phone }}<\u002Fdiv>\n              <div style=\"font-size:15px;line-height:21px;color:#0B213D\"><a href=\"https://www.getnauta.com\" target=\"_blank\" style=\"color:#2A78EA;text-decoration:underline\">www.getnauta.com<\u002Fa> · <a href=\"{{ linkedin }}\" target=\"_blank\" style=\"color:#2A78EA;text-decoration:underline\">LinkedIn<\u002Fa><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ hasLogo }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;align-items:center\">\n              <a href=\"https://www.getnauta.com\" target=\"_blank\" style=\"display:block;text-decoration:none;flex:none\">\n                <sc-if value=\"{{ isAnimated }}\" hint-placeholder-val=\"{{ true }}\">\n                  <img src=\"1bc04c8e-f2fb-4e71-85f2-9936d372d4cd\" alt=\"Nauta\" width=\"{{ logoW }}\" height=\"{{ logoH }}\" style=\"display:block;border:0\">\n                <\u002Fsc-if>\n                <sc-if value=\"{{ isStatic }}\" hint-placeholder-val=\"{{ false }}\">\n                  <img src=\"1e94bacb-8908-448b-a972-43e66ca8ac11\" alt=\"Nauta\" width=\"{{ logoW }}\" height=\"{{ logoH }}\" style=\"display:block;border:0\">\n                <\u002Fsc-if>\n              <\u002Fa>\n              <div style=\"padding-left:48px;white-space:nowrap\">\n                <div style=\"font-size:16px;font-weight:700;line-height:20px;color:#0B213D\">{{ name }}<\u002Fdiv>\n                <div style=\"font-size:15px;font-weight:700;line-height:20px;color:#0B213D\">{{ title }}<\u002Fdiv>\n                <div style=\"font-size:15px;font-weight:400;line-height:20px;color:#0B213D\">{{ phone }}<\u002Fdiv>\n                <div style=\"font-size:15px;font-weight:400;line-height:20px\"><a href=\"https://www.getnauta.com\" target=\"_blank\" style=\"color:#2A78EA;text-decoration:underline\">www.getnauta.com<\u002Fa><\u002Fdiv>\n                <div style=\"padding-top:8px\">\n                  <a href=\"{{ linkedin }}\" target=\"_blank\" style=\"display:inline-block;text-decoration:none\">\n                    <img src=\"a85b11a0-68c0-496a-98ca-23b1d36be170\" alt=\"LinkedIn\" width=\"28\" height=\"24\" style=\"display:block;border:0;width:28px;height:24px\">\n                  <\u002Fa>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;gap:16px;align-items:center;flex-wrap:wrap\">\n          <button type=\"button\" sc-camel-on-click=\"{{ copyRich }}\" style=\"display:inline-flex;align-items:center;gap:10px;background:#2A78EA;color:#FFFFFF;border:0;border-radius:8px;padding:15px 26px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:background 200ms cubic-bezier(0.4,0,0.2,1)\" style-hover=\"background:#0344A2\" style-active=\"opacity:0.9;transform:translateY(1px)\">\n            <svg data-icon=\"inbox\" style=\"width:17px;height:17px;flex:none\"><\u002Fsvg>{{ richLabel }}\n          <\u002Fbutton>\n          <div style=\"font-size:14px;line-height:1.5;color:#5A6B85\">Gmail: Settings, See all settings, Signature, then paste.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background:#0B213D;border-radius:12px;padding:44px 48px;display:flex;flex-direction:column;gap:32px\">\n      <div style=\"display:flex;flex-direction:column;gap:10px\">\n        <div style=\"font-family:'Martian Mono',monospace;font-size:11px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;color:#89B9FF\">When to use which<\u002Fdiv>\n        <div style=\"font-size:22px;line-height:1.35;color:#FFFFFF;max-width:720px;text-wrap:pretty\">The whole team runs <em style=\"font-style:italic;color:#E6FF77\">animated<\u002Fem>. Sales is the only exception, and only on the first touch.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:40px\">\n        <sc-for list=\"{{ guide }}\" as=\"g\" hint-placeholder-count=\"3\">\n          <div style=\"display:flex;flex-direction:column;gap:12px;border-top:1px solid rgba(255,255,255,0.18);padding-top:20px\">\n            <div style=\"font-family:'Martian Mono',monospace;font-size:11px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:#E6FF77\">{{ g.label }}<\u002Fdiv>\n            <div style=\"font-size:16px;font-weight:600;line-height:1.35;color:#FFFFFF\">{{ g.who }}<\u002Fdiv>\n            <div style=\"font-size:15px;line-height:1.55;color:rgba(255,255,255,0.72);text-wrap:pretty\">{{ g.text }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"font-size:13px;line-height:1.55;color:#9AA5BC\">Handing it to IT instead: <a href=\"signature/nauta-signature.html\" target=\"_blank\" style=\"color:#2A78EA;text-decoration:none;font-weight:600\">signature/nauta-signature.html<\u002Fa> carries the same table with FULL_NAME, JOB_TITLE, PHONE and LINKEDIN_URL tokens.<\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;logoVariant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;animated&quot;,&quot;static&quot;,&quot;text&quot;],&quot;default&quot;:&quot;animated&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Logo&quot;},&quot;logoWidth&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:215,&quot;min&quot;:140,&quot;max&quot;:300,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Logo&quot;}}\">\nconst STATIC_URL = 'https://www.info.getnauta.com/hubfs/Marketing%20-%20Brand/Logo/ISOLOGO_MARINE%20BLUE_NAUTA%20(1).png';\nconst GIF_URL = 'https://www.info.getnauta.com/hubfs/Marketing%20-%20Brand/Logo/Logo-nauta-animated-email-white.gif';\nconst LI_URL = 'https://www.info.getnauta.com/hubfs/Marketing%20-%20Brand/LI-In-Bug.png';\nconst FONT = \"'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif\";\nconst RATIO = { animated: 265 / 80, static: 1251 / 198 };\n\nclass Component extends DCLogic {\n  state = {\n    name: 'Mariana Jordan G.',\n    title: 'Head of Brand Design',\n    phone: '+52 557969908',\n    linkedin: 'https://www.linkedin.com/company/getnauta/',\n    variant: null,\n    copied: false\n  };\n\n  variant() { return this.state.variant || this.props.logoVariant || 'animated'; }\n\n  dims() {\n    const v = this.variant();\n    const w = Math.round((this.props.logoWidth ?? 215) * (v === 'animated' ? 1.235 : 1));\n    return { w: w, h: Math.round(w / (RATIO[v] || RATIO.static)) };\n  }\n\n  buildHtml() {\n    const s = this.state;\n    const v = this.variant();\n    const open = [\n      `<div style=\"background-color:#FFFFFF;color:#0B213D;\">`,\n      `<table cellpadding=\"0\" cellspacing=\"0\" border=\"0\" role=\"presentation\" style=\"border-collapse:collapse;background-color:#FFFFFF;font-family:${FONT}\">`,\n      `  <tr>`\n    ];\n    const close = [`  <\u002Ftr>`, `<\u002Ftable>`, `<\u002Fdiv>`];\n    if (v === 'text') {\n      return open.concat([\n        `    <td style=\"padding:0;font-family:${FONT}\">`,\n        `      <div style=\"font-size:15px;font-weight:700;line-height:21px;color:#0B213D;\">${s.name}<\u002Fdiv>`,\n        `      <div style=\"font-size:15px;line-height:21px;color:#0B213D;\">${s.title} · Nauta<\u002Fdiv>`,\n        `      <div style=\"font-size:15px;line-height:21px;color:#0B213D;\">${s.phone}<\u002Fdiv>`,\n        `      <div style=\"font-size:15px;line-height:21px;color:#0B213D;\"><a href=\"https://www.getnauta.com\" target=\"_blank\" style=\"color:#2A78EA;text-decoration:underline;\">www.getnauta.com<\u002Fa> · <a href=\"${s.linkedin}\" target=\"_blank\" style=\"color:#2A78EA;text-decoration:underline;\">LinkedIn<\u002Fa><\u002Fdiv>`,\n        `    <\u002Ftd>`\n      ], close).join('\\n');\n    }\n    const d = this.dims();\n    const logo = v === 'animated' ? GIF_URL : STATIC_URL;\n    return open.concat([\n      `    <td valign=\"middle\" style=\"padding:0 48px 0 0;\">`,\n      `      <a href=\"https://www.getnauta.com\" target=\"_blank\" style=\"text-decoration:none;\">`,\n      `        <img src=\"${logo}\" width=\"${d.w}\" height=\"${d.h}\" alt=\"Nauta\" style=\"display:block;border:0;outline:none;text-decoration:none;width:${d.w}px;height:${d.h}px;\">`,\n      `      <\u002Fa>`,\n      `    <\u002Ftd>`,\n      `    <td valign=\"middle\" style=\"padding:0;font-family:${FONT}\">`,\n      `      <div style=\"font-size:16px;font-weight:700;line-height:20px;color:#0B213D;\">${s.name}<\u002Fdiv>`,\n      `      <div style=\"font-size:15px;font-weight:700;line-height:20px;color:#0B213D;\">${s.title}<\u002Fdiv>`,\n      `      <div style=\"font-size:15px;font-weight:400;line-height:20px;color:#0B213D;\">${s.phone}<\u002Fdiv>`,\n      `      <div style=\"font-size:15px;line-height:20px;\"><a href=\"https://www.getnauta.com\" target=\"_blank\" style=\"color:#2A78EA;text-decoration:underline;\">www.getnauta.com<\u002Fa><\u002Fdiv>`,\n      `      <div style=\"padding-top:8px;\">`,\n      `        <a href=\"${s.linkedin}\" target=\"_blank\" style=\"text-decoration:none;\">`,\n      `          <img src=\"${LI_URL}\" width=\"28\" height=\"24\" alt=\"LinkedIn\" style=\"display:block;border:0;outline:none;width:28px;height:24px;\">`,\n      `        <\u002Fa>`,\n      `      <\u002Fdiv>`,\n      `    <\u002Ftd>`\n    ], close).join('\\n');\n  }\n\n  plainText() {\n    const s = this.state;\n    return [s.name, `${s.title} · Nauta`, s.phone, 'www.getnauta.com', s.linkedin].join('\\n');\n  }\n\n  legacyCopy(html) {\n    const d = document.createElement('div');\n    d.setAttribute('contenteditable', 'true');\n    // Explicit white ground: the serializer copies computed styles off this node,\n    // and without it the page's Ice Blue rides along into Gmail.\n    d.style.cssText = 'position:fixed;left:-9999px;top:0;white-space:normal;background:#FFFFFF;background-color:#FFFFFF;color:#0B213D;font-family:Helvetica,Arial,sans-serif';\n    d.innerHTML = html;\n    document.body.appendChild(d);\n    const r = document.createRange();\n    r.selectNodeContents(d);\n    const sel = window.getSelection();\n    sel.removeAllRanges();\n    sel.addRange(r);\n    try { document.execCommand('copy'); } catch (e) { /* noop */ }\n    sel.removeAllRanges();\n    d.remove();\n  }\n\n  renderVals() {\n    const s = this.state;\n    const v = this.variant();\n    const d = this.dims();\n    const tab = (on) => `background:${on ? '#0B213D' : '#FFFFFF'};color:${on ? '#FFFFFF' : '#5A6B85'};border:1px solid ${on ? '#0B213D' : 'rgba(11,33,61,0.16)'};border-radius:999px;padding:8px 18px;font-family:'Martian Mono',monospace;font-size:10px;font-weight:500;letter-spacing:0.1em;text-transform:uppercase;cursor:pointer;transition:all 200ms cubic-bezier(0.4,0,0.2,1)`;\n    const field = (k) => (e) => this.setState({ [k]: e.target.value });\n\n    return {\n      name: s.name,\n      title: s.title,\n      titleWithCompany: `${s.title} · Nauta`,\n      phone: s.phone,\n      linkedin: s.linkedin,\n      isAnimated: v === 'animated',\n      isStatic: v === 'static',\n      isText: v === 'text',\n      hasLogo: v !== 'text',\n      logoW: d.w,\n      logoH: d.h,\n      tabAnimStyle: tab(v === 'animated'),\n      tabStaticStyle: tab(v === 'static'),\n      tabTextStyle: tab(v === 'text'),\n      richLabel: s.copied ? 'Copied, now paste it' : 'Copy signature',\n      pickAnimated: () => this.setState({ variant: 'animated' }),\n      pickStatic: () => this.setState({ variant: 'static' }),\n      pickText: () => this.setState({ variant: 'text' }),\n      onName: field('name'),\n      onTitle: field('title'),\n      onPhone: field('phone'),\n      onLinkedin: field('linkedin'),\n      copyRich: async () => {\n        const html = this.buildHtml();\n        try {\n          if (navigator.clipboard && window.ClipboardItem) {\n            await navigator.clipboard.write([new window.ClipboardItem({\n              'text/html': new Blob([html], { type: 'text/html' }),\n              'text/plain': new Blob([this.plainText()], { type: 'text/plain' })\n            })]);\n          } else { this.legacyCopy(html); }\n        } catch (e) { this.legacyCopy(html); }\n        this.setState({ copied: true });\n        clearTimeout(this._t);\n        this._t = setTimeout(() => this.setState({ copied: false }), 2000);\n      },\n      guide: [\n        {\n          label: 'Animated',\n          who: 'Everyone, by default',\n          text: 'Internal threads, warm client replies, anything after a first response. The logo animates in Gmail and Apple Mail, and Outlook holds the finished lockup on frame one.'\n        },\n        {\n          label: 'Static',\n          who: 'Strict inboxes',\n          text: 'Same lockup as one small image. Use it when the recipient sits behind a corporate gateway that strips animation, or when a thread runs long and you want the lightest footprint.'\n        },\n        {\n          label: 'Cold outreach',\n          who: 'Sales, first touch only',\n          text: 'No images at all, so nothing gets stripped and the image to text ratio stays clean on a cold send. Switch to animated the moment they reply.'\n        }\n      ]\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
